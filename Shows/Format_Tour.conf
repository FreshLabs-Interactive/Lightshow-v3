# Lightshow v3 format tour - every feature in one short show.
# Lines starting with # are comments. Old v2 lines still work unchanged.
@name Format Tour
@author Lightshow
@loop 1
@end release

# Classic v2 frame: TL,TR,BL,BR,milliseconds
GREEN,OFF,OFF,OFF,150

# Short colour codes: G R O (or Y) and - (or X / OFF)
- G - - 150

# Compact 4-letter frame, quadrant order TL TR BL BR
---G 150
--G- 150

# Durations can use ms or s
ALL ORANGE 0.4s

# A frame can also set the power LED
G,G,G,G,200,POWER_BLINK

# * keeps a quadrant as it is - only the top-left changes here
R * * * 300

# REPEAT blocks (nest up to 8 deep)
REPEAT 3
  G - - - 80
  - G - - 80
  - - - G 80
  - - G - 80
END

# Hold the current state
WAIT 300

# Power LED on its own: POWER_ON / POWER_OFF / POWER_BLINK / POWER_DEFAULT
POWER_ON,0
ALL GREEN 600
